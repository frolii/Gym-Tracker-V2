  <!-- ALL-IN-ONE APP & DATENBANK LOGIK (Kein Nachladen externer .js Dateien nötig!) -->
  <script>
    // ============================================================================
    // 1. DATENBANK-SCHICHT (Dexie.js / IndexedDB + Automatischer LocalStorage-Fallback)
    // ============================================================================
    let db;

    // Falls Dexie weder lokal noch über CDN geladen werden konnte (z. B. komplett offline beim 1. Start ohne Upload von dexie.min.js),
    // stellt dieser Mini-Adapter exakt die gleiche Dexie-API über localStorage bereit, damit die App NIEMALS hängt!
    function createLocalStorageFallbackDB() {
      const STORAGE_PREFIX = 'iron_fallback_table_';
      function getTableData(name) {
        try {
          return JSON.parse(localStorage.getItem(STORAGE_PREFIX + name) || '[]');
        } catch (_) {
          return [];
        }
      }
      function saveTableData(name, arr) {
        localStorage.setItem(STORAGE_PREFIX + name, JSON.stringify(arr));
      }
      function makeTable(name) {
        return {
          async count() { return getTableData(name).length; },
          async toArray() { return getTableData(name); },
          async get(id) { return getTableData(name).find((r) => Number(r.id) === Number(id)) || null; },
          async bulkGet(ids) {
            const all = getTableData(name);
            return ids.map((id) => all.find((r) => Number(r.id) === Number(id)) || null);
          },
          async add(item) {
            const all = getTableData(name);
            const nextId = item.id ? Number(item.id) : all.reduce((m, r) => Math.max(m, Number(r.id) || 0), 0) + 1;
            const record = { ...item, id: nextId };
            all.push(record);
            saveTableData(name, all);
            return nextId;
          },
          async bulkAdd(items) {
            const ids = [];
            for (const item of items) {
              ids.push(await this.add(item));
            }
            return ids;
          },
          async bulkPut(items) {
            saveTableData(name, items);
          },
          async update(id, changes) {
            const all = getTableData(name);
            const idx = all.findIndex((r) => Number(r.id) === Number(id));
            if (idx !== -1) {
              all[idx] = { ...all[idx], ...changes };
              saveTableData(name, all);
            }
          },
          async delete(id) {
            const all = getTableData(name).filter((r) => Number(r.id) !== Number(id));
            saveTableData(name, all);
          },
          async clear() {
            saveTableData(name, []);
          },
          filter(fn) {
            return {
              async toArray() { return getTableData(name).filter(fn); }
            };
          },
          where(indexName) {
            return {
              equals(val) {
                return {
                  async toArray() {
                    const all = getTableData(name);
                    if (indexName === '[workoutId+exerciseId]' && Array.isArray(val)) {
                      return all.filter(
                        (r) => Number(r.workoutId) === Number(val[0]) && Number(r.exerciseId) === Number(val[1])
                      );
                    }
                    return all.filter((r) => Number(r[indexName]) === Number(val));
                  },
                  async delete() {
                    const all = getTableData(name).filter((r) => Number(r[indexName]) !== Number(val));
                    saveTableData(name, all);
                  }
                };
              }
            };
          }
        };
      }

      return {
        exercises: makeTable('exercises'),
        routines: makeTable('routines'),
        workouts: makeTable('workouts'),
        sets: makeTable('sets'),
        async transaction(_mode, ...args) {
          const cb = args[args.length - 1];
          return await cb();
        }
      };
    }

    if (typeof window.Dexie !== 'undefined') {
      db = new Dexie('IronGymTrackerDB');
      db.version(1).stores({
        exercises: '++id, name, defaultRestSeconds, targetSets',
        routines: '++id, name, *exerciseIds',
        workouts: '++id, routineId, date, completed',
        sets: '++id, workoutId, exerciseId, setNumber, weight, reps, completed, timestamp, [workoutId+exerciseId]'
      });
    } else {
      db = createLocalStorageFallbackDB();
    }

    function formatWeight(weight) {
      const num = Number(weight);
      if (!Number.isFinite(num)) return '0';
      return Number(num.toFixed(2)).toString();
    }

    async function ensureSeedData() {
      const exerciseCount = await db.exercises.count();
      if (exerciseCount > 0) return;

      await db.transaction('rw', db.exercises, db.routines, db.workouts, db.sets, async () => {
        const exIds = await db.exercises.bulkAdd(
          [
            { name: 'Bankdrücken (Langhantel)', defaultRestSeconds: 180, targetSets: 3 },
            { name: 'Schrägbankdrücken (Kurzhantel)', defaultRestSeconds: 120, targetSets: 3 },
            { name: 'Schulterdrücken (Kurzhantel)', defaultRestSeconds: 120, targetSets: 3 },
            { name: 'Seitheben (Kabel/KH)', defaultRestSeconds: 90, targetSets: 4 },
            { name: 'Trizepsdrücken am Kabel', defaultRestSeconds: 90, targetSets: 3 },
            { name: 'Klimmzüge / Latzug', defaultRestSeconds: 150, targetSets: 3 },
            { name: 'Langhantelrudern', defaultRestSeconds: 150, targetSets: 3 },
            { name: 'Rudern eng am Kabel', defaultRestSeconds: 120, targetSets: 3 },
            { name: 'Face Pulls', defaultRestSeconds: 90, targetSets: 3 },
            { name: 'LH- / SZ-Bizepscurls', defaultRestSeconds: 90, targetSets: 3 },
            { name: 'Kniebeugen (Langhantel)', defaultRestSeconds: 180, targetSets: 3 },
            { name: 'Rumänisches Kreuzheben (RDL)', defaultRestSeconds: 150, targetSets: 3 },
            { name: 'Beinpresse', defaultRestSeconds: 120, targetSets: 3 },
            { name: 'Wadenheben stehend', defaultRestSeconds: 90, targetSets: 4 }
          ],
          { allKeys: true }
        );

        const [
          benchId, inclineDbId, shoulderPressId, lateralRaiseId, tricepsId,
          pullupId, barbellRowId, cableRowId, facePullId, curlId,
          squatId, rdlId, legPressId, calfId
        ] = exIds;

        const routineIds = await db.routines.bulkAdd(
          [
            {
              name: 'Push (Brust, Schulter, Trizeps)',
              exerciseIds: [benchId, inclineDbId, shoulderPressId, lateralRaiseId, tricepsId]
            },
            {
              name: 'Pull (Rücken, hintere Schulter, Bizeps)',
              exerciseIds: [pullupId, barbellRowId, cableRowId, facePullId, curlId]
            },
            {
              name: 'Legs (Beine & Rumpf)',
              exerciseIds: [squatId, rdlId, legPressId, calfId]
            }
          ],
          { allKeys: true }
        );

        const [pushRoutineId, pullRoutineId] = routineIds;
        const now = Date.now();
        const dayMs = 24 * 60 * 60 * 1000;

        // Älteres Push-Workout (vor 7 Tagen) für All-Time PR Demonstration
        const oldPushWorkoutId = await db.workouts.add({
          routineId: pushRoutineId,
          date: now - 7 * dayMs,
          completed: true
        });

        await db.sets.bulkAdd([
          { workoutId: oldPushWorkoutId, exerciseId: benchId, setNumber: 1, weight: 82.5, reps: 6, completed: true, timestamp: now - 7 * dayMs },
          { workoutId: oldPushWorkoutId, exerciseId: benchId, setNumber: 2, weight: 80, reps: 7, completed: true, timestamp: now - 7 * dayMs + 180000 },
          { workoutId: oldPushWorkoutId, exerciseId: benchId, setNumber: 3, weight: 77.5, reps: 8, completed: true, timestamp: now - 7 * dayMs + 360000 }
        ]);

        // Letztes Push-Workout (vor 3 Tagen) für "Letztes Mal" & Smart Pre-Fill
        const lastPushWorkoutId = await db.workouts.add({
          routineId: pushRoutineId,
          date: now - 3 * dayMs,
          completed: true
        });

        await db.sets.bulkAdd([
          { workoutId: lastPushWorkoutId, exerciseId: benchId, setNumber: 1, weight: 80, reps: 8, completed: true, timestamp: now - 3 * dayMs },
          { workoutId: lastPushWorkoutId, exerciseId: benchId, setNumber: 2, weight: 80, reps: 8, completed: true, timestamp: now - 3 * dayMs + 180000 },
          { workoutId: lastPushWorkoutId, exerciseId: benchId, setNumber: 3, weight: 77.5, reps: 7, completed: true, timestamp: now - 3 * dayMs + 360000 },

          { workoutId: lastPushWorkoutId, exerciseId: inclineDbId, setNumber: 1, weight: 32, reps: 8, completed: true, timestamp: now - 3 * dayMs + 500000 },
          { workoutId: lastPushWorkoutId, exerciseId: inclineDbId, setNumber: 2, weight: 32, reps: 8, completed: true, timestamp: now - 3 * dayMs + 620000 },
          { workoutId: lastPushWorkoutId, exerciseId: inclineDbId, setNumber: 3, weight: 30, reps: 7, completed: true, timestamp: now - 3 * dayMs + 740000 },

          { workoutId: lastPushWorkoutId, exerciseId: shoulderPressId, setNumber: 1, weight: 24, reps: 9, completed: true, timestamp: now - 3 * dayMs + 900000 },
          { workoutId: lastPushWorkoutId, exerciseId: shoulderPressId, setNumber: 2, weight: 24, reps: 8, completed: true, timestamp: now - 3 * dayMs + 1020000 },
          { workoutId: lastPushWorkoutId, exerciseId: shoulderPressId, setNumber: 3, weight: 22, reps: 9, completed: true, timestamp: now - 3 * dayMs + 1140000 },

          { workoutId: lastPushWorkoutId, exerciseId: lateralRaiseId, setNumber: 1, weight: 12.5, reps: 12, completed: true, timestamp: now - 3 * dayMs + 1300000 },
          { workoutId: lastPushWorkoutId, exerciseId: lateralRaiseId, setNumber: 2, weight: 12.5, reps: 12, completed: true, timestamp: now - 3 * dayMs + 1390000 },
          { workoutId: lastPushWorkoutId, exerciseId: lateralRaiseId, setNumber: 3, weight: 12.5, reps: 11, completed: true, timestamp: now - 3 * dayMs + 1480000 },
          { workoutId: lastPushWorkoutId, exerciseId: lateralRaiseId, setNumber: 4, weight: 10, reps: 14, completed: true, timestamp: now - 3 * dayMs + 1570000 },

          { workoutId: lastPushWorkoutId, exerciseId: tricepsId, setNumber: 1, weight: 27.5, reps: 12, completed: true, timestamp: now - 3 * dayMs + 1700000 },
          { workoutId: lastPushWorkoutId, exerciseId: tricepsId, setNumber: 2, weight: 27.5, reps: 11, completed: true, timestamp: now - 3 * dayMs + 1790000 },
          { workoutId: lastPushWorkoutId, exerciseId: tricepsId, setNumber: 3, weight: 25, reps: 12, completed: true, timestamp: now - 3 * dayMs + 1880000 }
        ]);

        // Letztes Pull-Workout (vor 2 Tagen)
        const lastPullWorkoutId = await db.workouts.add({
          routineId: pullRoutineId,
          date: now - 2 * dayMs,
          completed: true
        });

        await db.sets.bulkAdd([
          { workoutId: lastPullWorkoutId, exerciseId: pullupId, setNumber: 1, weight: 75, reps: 8, completed: true, timestamp: now - 2 * dayMs },
          { workoutId: lastPullWorkoutId, exerciseId: pullupId, setNumber: 2, weight: 75, reps: 8, completed: true, timestamp: now - 2 * dayMs + 150000 },
          { workoutId: lastPullWorkoutId, exerciseId: pullupId, setNumber: 3, weight: 70, reps: 9, completed: true, timestamp: now - 2 * dayMs + 300000 },

          { workoutId: lastPullWorkoutId, exerciseId: barbellRowId, setNumber: 1, weight: 70, reps: 8, completed: true, timestamp: now - 2 * dayMs + 500000 },
          { workoutId: lastPullWorkoutId, exerciseId: barbellRowId, setNumber: 2, weight: 70, reps: 8, completed: true, timestamp: now - 2 * dayMs + 650000 },
          { workoutId: lastPullWorkoutId, exerciseId: barbellRowId, setNumber: 3, weight: 67.5, reps: 8, completed: true, timestamp: now - 2 * dayMs + 800000 }
        ]);
      });
    }

    async function getActiveWorkoutOfToday() {
      const startOfDay = new Date();
      startOfDay.setHours(0, 0, 0, 0);
      const startMs = startOfDay.getTime();

      const allOpenWorkouts = await db.workouts
        .filter((w) => !w.completed && w.date >= startMs)
        .toArray();

      if (allOpenWorkouts.length === 0) return null;
      allOpenWorkouts.sort((a, b) => b.date - a.date);
      return allOpenWorkouts[0];
    }

    async function getExerciseStats(exerciseId, currentWorkoutId = null) {
      const allExerciseSets = await db.sets
        .where('exerciseId')
        .equals(Number(exerciseId))
        .toArray();

      const completedSets = allExerciseSets.filter(
        (s) => s.completed === true && Number(s.reps) > 0
      );

      // All-Time PR nach real bewegtem Höchstgewicht max(weight), dann max(reps)
      let prSet = null;
      for (const s of completedSets) {
        const w = Number(s.weight) || 0;
        const r = Number(s.reps) || 0;
        if (!prSet) {
          prSet = { weight: w, reps: r, workoutId: s.workoutId };
        } else if (w > prSet.weight || (w === prSet.weight && r > prSet.reps)) {
          prSet = { weight: w, reps: r, workoutId: s.workoutId };
        }
      }

      const previousSets = completedSets.filter(
        (s) => s.workoutId !== Number(currentWorkoutId)
      );

      if (previousSets.length === 0) {
        return { lastSets: [], prSet, lastWorkoutDate: null };
      }

      const workoutIds = [...new Set(previousSets.map((s) => s.workoutId))];
      const workouts = await db.workouts.bulkGet(workoutIds);
      const validWorkouts = workouts.filter(Boolean);

      let latestWorkout = null;
      for (const w of validWorkouts) {
        if (!latestWorkout || w.date > latestWorkout.date) {
          latestWorkout = w;
        }
      }

      if (!latestWorkout) {
        return { lastSets: [], prSet, lastWorkoutDate: null };
      }

      const lastSets = previousSets
        .filter((s) => s.workoutId === latestWorkout.id)
        .sort((a, b) => a.setNumber - b.setNumber);

      return {
        lastSets,
        prSet,
        lastWorkoutDate: latestWorkout.date
      };
    }

    async function createWorkoutFromRoutine(routineId) {
      const routine = await db.routines.get(Number(routineId));
      if (!routine) throw new Error('Routine nicht gefunden');

      const now = Date.now();
      const workoutId = await db.workouts.add({
        routineId: routine.id,
        date: now,
        completed: false
      });

      const exercises = await db.exercises.bulkGet(routine.exerciseIds.map(Number));
      const setsToCreate = [];

      for (const exercise of exercises) {
        if (!exercise) continue;
        const { lastSets } = await getExerciseStats(exercise.id, workoutId);
        const numSets =
          lastSets.length > 0
            ? lastSets.length
            : Math.max(1, Number(exercise.targetSets) || 3);

        for (let i = 0; i < numSets; i++) {
          const refSet = lastSets[i] || lastSets[lastSets.length - 1] || null;
          setsToCreate.push({
            workoutId,
            exerciseId: exercise.id,
            setNumber: i + 1,
            weight: refSet ? Number(refSet.weight) : '',
            reps: refSet ? Number(refSet.reps) : '',
            completed: false,
            timestamp: now
          });
        }
      }

      if (setsToCreate.length > 0) {
        await db.sets.bulkAdd(setsToCreate);
      }

      return workoutId;
    }

    async function exportDatabaseToJson() {
      const [exercises, routines, workouts, sets] = await Promise.all([
        db.exercises.toArray(),
        db.routines.toArray(),
        db.workouts.toArray(),
        db.sets.toArray()
      ]);

      return {
        app: 'IRON-Gym-Tracker',
        version: 1,
        exportedAt: new Date().toISOString(),
        data: { exercises, routines, workouts, sets }
      };
    }

    async function importDatabaseFromJson(backupObj) {
      if (!backupObj || !backupObj.data) {
        throw new Error('Ungültiges Backup-Format: "data"-Objekt fehlt.');
      }
      const { exercises, routines, workouts, sets } = backupObj.data;
      if (!Array.isArray(exercises) || !Array.isArray(routines) || !Array.isArray(workouts) || !Array.isArray(sets)) {
        throw new Error('Ungültiges Backup-Format.');
      }

      await db.transaction('rw', db.exercises, db.routines, db.workouts, db.sets, async () => {
        await Promise.all([
          db.exercises.clear(),
          db.routines.clear(),
          db.workouts.clear(),
          db.sets.clear()
        ]);

        if (exercises.length) await db.exercises.bulkPut(exercises);
        if (routines.length) await db.routines.bulkPut(routines);
        if (workouts.length) await db.workouts.bulkPut(workouts);
        if (sets.length) await db.sets.bulkPut(sets);
      });
    }

    // ============================================================================
    // 2. UI & TIMER CONTROLLER
    // ============================================================================
    const TIMER_STORAGE_KEY = 'iron_gym_rest_timer_v1';

    const state = {
      currentTab: 'home',
      activeWorkoutId: null,
      manageRoutineDraftIds: [],
      editingRoutineId: null,
      timerIntervalId: null,
      audioCtx: null
    };

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function formatSecondsMMSS(totalSeconds) {
      const sec = Math.max(0, Math.round(totalSeconds));
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function formatDateShort(ts) {
      if (!ts) return '';
      const d = new Date(ts);
      return d.toLocaleDateString('de-DE', {
        day: '2-digit',
        month: '2-digit',
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const colors =
        type === 'error'
          ? 'bg-rose-950/95 border-rose-500 text-rose-200'
          : 'bg-zinc-900/95 border-emerald-500/80 text-emerald-300';

      const el = document.createElement('div');
      el.className = `${colors} border px-4 py-2.5 rounded-xl shadow-xl text-xs font-bold tracking-wide transition-all duration-200 pointer-events-auto`;
      el.textContent = message;
      container.innerHTML = '';
      container.appendChild(el);

      setTimeout(() => {
        if (el.parentNode) el.remove();
      }, 2400);
    }

    function triggerTimerAlarm() {
      if ('vibrate' in navigator) {
        try { navigator.vibrate([250, 120, 350]); } catch (_) {}
      }
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;
        if (!state.audioCtx) state.audioCtx = new AudioContextClass();
        const ctx = state.audioCtx;
        if (ctx.state === 'suspended') ctx.resume();

        const playTone = (freq, startOffset, duration) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, ctx.currentTime + startOffset);
          gain.gain.setValueAtTime(0.001, ctx.currentTime + startOffset);
          gain.gain.exponentialRampToValueAtTime(0.28, ctx.currentTime + startOffset + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + startOffset + duration);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + startOffset);
          osc.stop(ctx.currentTime + startOffset + duration);
        };

        playTone(880, 0, 0.16);
        playTone(1174.66, 0.2, 0.28);
      } catch (_) {}
    }

    function unlockAudioContextOnce() {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) return;
      const unlock = () => {
        try {
          if (!state.audioCtx) state.audioCtx = new AudioContextClass();
          if (state.audioCtx.state === 'suspended') state.audioCtx.resume();
        } catch (_) {}
        document.removeEventListener('touchstart', unlock);
        document.removeEventListener('click', unlock);
      };
      document.addEventListener('touchstart', unlock, { passive: true });
      document.addEventListener('click', unlock, { passive: true });
    }

    function getStoredTimer() {
      try {
        const raw = localStorage.getItem(TIMER_STORAGE_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch (_) {
        return null;
      }
    }

    function setStoredTimer(timerData) {
      if (!timerData) localStorage.removeItem(TIMER_STORAGE_KEY);
      else localStorage.setItem(TIMER_STORAGE_KEY, JSON.stringify(timerData));
    }

    function startRestTimer(restSeconds, exerciseName = 'Satzpause') {
      const durationSec = Math.max(5, Number(restSeconds) || 90);
      const now = Date.now();
      const endTime = now + durationSec * 1000;
      setStoredTimer({ endTime, totalSeconds: durationSec, exerciseName });
      syncRestTimerUI();
      ensureTimerLoop();
    }

    function adjustRestTimer(deltaSeconds) {
      const timer = getStoredTimer();
      if (!timer) return;
      const now = Date.now();
      const newEndTime = Math.max(now + 1000, timer.endTime + deltaSeconds * 1000);
      const remainingSec = Math.round((newEndTime - now) / 1000);
      const newTotal = Math.max(timer.totalSeconds, remainingSec);
      setStoredTimer({ ...timer, endTime: newEndTime, totalSeconds: newTotal });
      syncRestTimerUI();
    }

    function stopRestTimer() {
      setStoredTimer(null);
      if (state.timerIntervalId) {
        clearInterval(state.timerIntervalId);
        state.timerIntervalId = null;
      }
      document.getElementById('rest-timer-bar')?.classList.add('hidden');
    }

    function syncRestTimerUI() {
      const bar = document.getElementById('rest-timer-bar');
      const countdownEl = document.getElementById('timer-countdown');
      const labelEl = document.getElementById('timer-exercise-label');
      const progressEl = document.getElementById('timer-progress-bar');

      const timer = getStoredTimer();
      if (!timer) {
        bar?.classList.add('hidden');
        return;
      }

      const remainingSeconds = Math.round((timer.endTime - Date.now()) / 1000);
      if (remainingSeconds <= 0) {
        stopRestTimer();
        triggerTimerAlarm();
        showToast('⏱ Pause abgelaufen — Nächster Satz!');
        return;
      }

      bar?.classList.remove('hidden');
      if (labelEl) labelEl.textContent = `⏱ PAUSE • ${timer.exerciseName}`;
      if (countdownEl) countdownEl.textContent = formatSecondsMMSS(remainingSeconds);
      if (progressEl) {
        const pct = Math.min(100, Math.max(0, (remainingSeconds / timer.totalSeconds) * 100));
        progressEl.style.width = `${pct}%`;
      }
    }

    function ensureTimerLoop() {
      if (state.timerIntervalId) clearInterval(state.timerIntervalId);
      state.timerIntervalId = setInterval(syncRestTimerUI, 250);
    }

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') syncRestTimerUI();
    });
    window.addEventListener('focus', syncRestTimerUI);

    function updateNavHighlight() {
      const activeKey = state.currentTab === 'workout' ? 'home' : state.currentTab;
      document.querySelectorAll('.nav-tab').forEach((btn) => {
        const isActive = btn.dataset.nav === activeKey;
        btn.className = `nav-tab flex flex-col items-center justify-center gap-1 text-xs font-bold transition-colors cursor-pointer ${
          isActive ? 'text-emerald-400' : 'text-zinc-500 hover:text-zinc-300'
        }`;
      });
    }

    async function navigateTo(tab, workoutId = null) {
      state.currentTab = tab;
      if (workoutId !== null) state.activeWorkoutId = Number(workoutId);
      updateNavHighlight();
      await renderCurrentView();

    async function renderCurrentView() {
      const main = document.getElementById('app-main');
      const headerActions = document.getElementById('header-actions');
      const subtitle = document.getElementById('header-subtitle');
      if (!main) return;
      headerActions.innerHTML = '';

      if (state.currentTab === 'home') {
        subtitle.textContent = 'Wähle dein heutiges Training';
        await renderHomeScreen(main);
      } else if (state.currentTab === 'workout') {
        await renderWorkoutScreen(main, headerActions, subtitle);
      } else if (state.currentTab === 'manage') {
        subtitle.textContent = 'Übungen & Routinen verwalten';
        await renderManageScreen(main);
      } else if (state.currentTab === 'settings') {
        subtitle.textContent = 'Lokales Datenbank-Backup (JSON)';
        await renderSettingsScreen(main);
      }
    }

    async function renderWorkoutScreen(container, headerActions, subtitle) {
      if (!state.activeWorkoutId) {
        const activeToday = await getActiveWorkoutOfToday();
        if (activeToday) state.activeWorkoutId = activeToday.id;
        else return navigateTo('home');
      }

      const workout = await db.workouts.get(Number(state.activeWorkoutId));
      if (!workout) {
        state.activeWorkoutId = null;
        return navigateTo('home');
      }

      const routine = await db.routines.get(Number(workout.routineId));
      const workoutSets = await db.sets.where('workoutId').equals(workout.id).toArray();

      const exerciseOrderIds = routine
        ? routine.exerciseIds.map(Number)
        : [...new Set(workoutSets.map((s) => Number(s.exerciseId)))];

      const exercisesList = await db.exercises.bulkGet(exerciseOrderIds);
      const validExercises = exercisesList.filter(Boolean);

      headerActions.innerHTML = `

          ✓ Beenden
        </button>
      `;

      if (!exercise) return;
      const backdrop = document.getElementById('modal-backdrop');
      const content = document.getElementById('modal-content');
      if (!backdrop || !content) return;

      const presets = [60, 90, 120, 150, 180, 240];
      content.innerHTML = `
        <div class="flex items-center justify-between mb-3">
          <h3 class="text-base font-black text-white truncate">${escapeHtml(exercise.name)}</h3>
          <button type="button" data-action="close-modal" class="w-9 h-9 rounded-lg bg-zinc-800 text-zinc-400 font-bold cursor-pointer">✕</button>
        </div>
        <p class="text-xs text-zinc-400 mb-3">Individuelle Pausenzeit in Sekunden:</p>
        <div class="grid grid-cols-3 gap-2 mb-3">
          ${presets

              (sec) => `
              <button type="button" data-action="preset-rest" data-seconds="${sec}"

                  exercise.defaultRestSeconds === sec
                    ? 'bg-emerald-500/20 border-emerald-500 text-emerald-300'
                    : 'bg-zinc-950 border-zinc-800 text-zinc-300'
                }">
                ${sec}s
              </button>
            `
            )
            .join('')}
        </div>
        <form id="form-update-rest" data-exercise-id="${exercise.id}" class="flex gap-2">

            class="flex-1 h-12 rounded-xl bg-zinc-950 border border-zinc-700 px-3 text-center font-mono text-lg font-black text-white focus:border-emerald-500 focus:outline-none" />
          <button type="submit" class="h-12 px-5 rounded-xl bg-emerald-500 text-zinc-950 font-black text-sm cursor-pointer">

      `;
      backdrop.classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('modal-backdrop')?.classList.add('hidden');
    }

    function bindEvents() {
      document.querySelectorAll('.nav-tab').forEach((btn) => {
        btn.addEventListener('click', () => {
          const target = btn.dataset.nav;
          if (target === 'home' && state.activeWorkoutId) {
            navigateTo('workout', state.activeWorkoutId);
          } else {
            navigateTo(target);
          }
        });
      });

      document.getElementById('btn-timer-minus')?.addEventListener('click', () => adjustRestTimer(-15));
      document.getElementById('btn-timer-plus')?.addEventListener('click', () => adjustRestTimer(30));
      document.getElementById('btn-timer-skip')?.addEventListener('click', () => {
        stopRestTimer();
        showToast('Pause übersprungen');
      });

      document.addEventListener('input', async (e) => {
        const input = e.target.closest('input[data-input-field]');
        if (!input) return;
        const setId = Number(input.dataset.setId);
        const field = input.dataset.inputField;
        const rawVal = input.value.trim().replace(',', '.');

        const updatePayload = {};
        if (field === 'weight') updatePayload.weight = rawVal === '' ? '' : parseFloat(rawVal);
        else if (field === 'reps') updatePayload.reps = rawVal === '' ? '' : parseInt(rawVal, 10);

        await db.sets.update(setId, updatePayload);
        const row = input.closest('.set-row');
        if (row) await refreshExerciseBadgesInDOM(Number(row.dataset.exerciseId));
      });

      document.addEventListener('change', async (e) => {
        if (e.target && e.target.id === 'input-import-backup') {
          const file = e.target.files?.[0];
          if (!file) return;
          try {
            const text = await file.text();
            const parsed = JSON.parse(text);
            await importDatabaseFromJson(parsed);
            state.activeWorkoutId = null;
            showToast('Backup erfolgreich wiederhergestellt!');
            await renderCurrentView();
          } catch (err) {
            showToast(`Import-Fehler: ${err.message}`, 'error');
          } finally {
            e.target.value = '';
          }
        }
      });

      document.addEventListener('submit', async (e) => {
        const form = e.target;

        if (form.id === 'form-new-exercise') {
          e.preventDefault();
          const fd = new FormData(form);
          const name = String(fd.get('name') || '').trim();
          const defaultRestSeconds = Math.max(10, parseInt(fd.get('defaultRestSeconds'), 10) || 120);
          const targetSets = Math.max(1, parseInt(fd.get('targetSets'), 10) || 3);
          if (!name) return;
          const newId = await db.exercises.add({ name, defaultRestSeconds, targetSets });
          state.manageRoutineDraftIds.push(Number(newId));
          form.reset();
          showToast(`Übung "${name}" angelegt`);
          await renderCurrentView();
        }

        if (form.id === 'form-save-routine') {
          e.preventDefault();
          const nameInput = document.getElementById('routine-name-input');
          const name = String(nameInput?.value || '').trim();
          if (!name) return;
          if (state.manageRoutineDraftIds.length === 0) {
            showToast('Bitte mindestens eine Übung zur Routine hinzufügen', 'error');
            return;
          }

          if (state.editingRoutineId) {
            await db.routines.update(state.editingRoutineId, {
              name,
              exerciseIds: [...state.manageRoutineDraftIds]
            });
            showToast(`Routine "${name}" aktualisiert`);
          } else {
            await db.routines.add({
              name,
              exerciseIds: [...state.manageRoutineDraftIds]
            });
            showToast(`Routine "${name}" erstellt`);
          }

          state.editingRoutineId = null;
          state.manageRoutineDraftIds = [];
          await renderCurrentView();
        }

        if (form.id === 'form-update-rest') {
          e.preventDefault();
          const exerciseId = Number(form.dataset.exerciseId);
          const input = document.getElementById('modal-rest-input');
          const newSec = Math.max(10, parseInt(input?.value, 10) || 90);
          await db.exercises.update(exerciseId, { defaultRestSeconds: newSec });

          const label = document.querySelector(`[data-rest-label="${exerciseId}"]`);
          if (label) label.textContent = `${newSec}s`;
          closeModal();
          showToast(`Pausenzeit auf ${newSec}s gesetzt`);
          if (state.currentTab === 'manage') await renderCurrentView();
        }
      });

      document.addEventListener('click', async (e) => {
        const btn = e.target.closest('[data-action]');
        if (!btn) {
          if (e.target.id === 'modal-backdrop') closeModal();
          return;
        }

        const action = btn.dataset.action;

        if (action === 'start-routine') {
          const routineId = Number(btn.dataset.routineId);
          const workoutId = await createWorkoutFromRoutine(routineId);
          await navigateTo('workout', workoutId);
          showToast('Workout gestartet — Viel Erfolg!');
        }

        if (action === 'resume-workout') {
          await navigateTo('workout', Number(btn.dataset.workoutId));
        }

        if (action === 'discard-workout') {
          const workoutId = Number(btn.dataset.workoutId);
          await db.transaction('rw', db.workouts, db.sets, async () => {
            await db.sets.where('workoutId').equals(workoutId).delete();
            await db.workouts.delete(workoutId);
          });
          if (state.activeWorkoutId === workoutId) state.activeWorkoutId = null;
          stopRestTimer();
          showToast('Workout verworfen');
          await renderCurrentView();
        }

        if (action === 'go-manage') {
          await navigateTo('manage');
        }

        if (action === 'toggle-set') {
          const setId = Number(btn.dataset.setId);
          const exerciseId = Number(btn.dataset.exerciseId);
          const setObj = await db.sets.get(setId);
          const exercise = await db.exercises.get(exerciseId);
          if (!setObj || !exercise) return;

          const row = btn.closest('.set-row');
          const weightInput = row?.querySelector('input[data-input-field="weight"]');
          const repsInput = row?.querySelector('input[data-input-field="reps"]');

          let weightVal = weightInput?.value.trim().replace(',', '.');
          if (weightVal === '' || weightVal === undefined) {
            weightVal = weightInput?.getAttribute('placeholder') || '0';
            if (weightInput) weightInput.value = weightVal;
          }

          let repsVal = repsInput?.value.trim();
          if (repsVal === '' || repsVal === undefined) {
            repsVal = repsInput?.getAttribute('placeholder') || '8';
            if (repsInput) repsInput.value = repsVal;
          }

          const finalWeight = parseFloat(weightVal) || 0;
          const finalReps = parseInt(repsVal, 10) || 0;
          const nextCompleted = !setObj.completed;

          await db.sets.update(setId, {
            weight: finalWeight,
            reps: finalReps,
            completed: nextCompleted,
            timestamp: Date.now()
          });

          if (row) {
            row.className = `set-row grid grid-cols-12 items-center gap-1.5 p-1.5 rounded-xl border transition-colors ${
              nextCompleted ? 'bg-emerald-950/40 border-emerald-500/50' : 'bg-zinc-950/70 border-zinc-800/90'
            }`;
            const badge = row.querySelector('.set-number-badge');
            if (badge) {
              badge.className = `set-number-badge w-8 h-10 rounded-lg bg-zinc-900 border flex items-center justify-center text-xs font-black ${
                nextCompleted ? 'text-emerald-400 border-emerald-500/40' : 'text-zinc-400 border-zinc-800'
              }`;
            }
            btn.className = `w-full h-12 rounded-xl border font-black text-lg flex items-center justify-center transition-all cursor-pointer ${
              nextCompleted
                ? 'bg-emerald-500 text-zinc-950 border-emerald-400 shadow-md shadow-emerald-500/20'
                : 'bg-zinc-800/90 text-zinc-400 border-zinc-700 active:bg-zinc-700'
            }`;
          }

          await refreshExerciseBadgesInDOM(exerciseId);
          if (nextCompleted) startRestTimer(exercise.defaultRestSeconds, exercise.name);
        }

        if (action === 'add-set') {
          const exerciseId = Number(btn.dataset.exerciseId);
          const exercise = await db.exercises.get(exerciseId);
          if (!exercise || !state.activeWorkoutId) return;

          const existingSets = await db.sets
            .where('[workoutId+exerciseId]')
            .equals([Number(state.activeWorkoutId), exerciseId])
            .toArray();
          existingSets.sort((a, b) => a.setNumber - b.setNumber);

          const nextSetNum = existingSets.length + 1;
          const stats = await getExerciseStats(exerciseId, state.activeWorkoutId);
          const lastExisting = existingSets[existingSets.length - 1];
          const refFromHistory =
            stats.lastSets[nextSetNum - 1] || stats.lastSets[stats.lastSets.length - 1] || null;

          const prefillWeight =
            lastExisting && lastExisting.weight !== ''
              ? Number(lastExisting.weight)
              : refFromHistory
              ? Number(refFromHistory.weight)
              : '';
          const prefillReps =
            lastExisting && lastExisting.reps !== ''
              ? Number(lastExisting.reps)
              : refFromHistory
              ? Number(refFromHistory.reps)
              : '';

          const newSetObj = {
            workoutId: Number(state.activeWorkoutId),
            exerciseId,
            setNumber: nextSetNum,
            weight: prefillWeight,
            reps: prefillReps,
            completed: false,
            timestamp: Date.now()
          };

          const newId = await db.sets.add(newSetObj);
          newSetObj.id = newId;

          const listEl = document.querySelector(`[data-sets-list="${exerciseId}"]`);
          if (listEl) {
            listEl.insertAdjacentHTML('beforeend', renderSetRowHtml(newSetObj, exercise, refFromHistory));
          }
        }

        if (action === 'delete-set') {
          const setId = Number(btn.dataset.setId);
          const exerciseId = Number(btn.dataset.exerciseId);
          await db.sets.delete(setId);

          const remaining = await db.sets
            .where('[workoutId+exerciseId]')
            .equals([Number(state.activeWorkoutId), exerciseId])
            .toArray();
          remaining.sort((a, b) => a.setNumber - b.setNumber);

          for (let i = 0; i < remaining.length; i++) {
            await db.sets.update(remaining[i].id, { setNumber: i + 1 });
          }

          const exercise = await db.exercises.get(exerciseId);
          const stats = await getExerciseStats(exerciseId, state.activeWorkoutId);
          const listEl = document.querySelector(`[data-sets-list="${exerciseId}"]`);
          if (listEl && exercise) {
            const updatedSets = await db.sets
              .where('[workoutId+exerciseId]')
              .equals([Number(state.activeWorkoutId), exerciseId])
              .toArray();
            updatedSets.sort((a, b) => a.setNumber - b.setNumber);
            listEl.innerHTML = updatedSets
              .map((s, idx) => {
                const refSet = stats.lastSets[idx] || stats.lastSets[stats.lastSets.length - 1] || null;
                return renderSetRowHtml(s, exercise, refSet);
              })
              .join('');
          }
          await refreshExerciseBadgesInDOM(exerciseId);
        }

        if (action === 'finish-workout') {
          const workoutId = Number(btn.dataset.workoutId);
          await db.workouts.update(workoutId, { completed: true, date: Date.now() });
          state.activeWorkoutId = null;
          stopRestTimer();
          showToast('🏆 Training abgeschlossen & gespeichert!');
          await navigateTo('home');
        }

        if (action === 'edit-rest-time') {
          await openEditRestModal(Number(btn.dataset.exerciseId));
        }

        if (action === 'preset-rest') {
          const input = document.getElementById('modal-rest-input');
          if (input) input.value = String(btn.dataset.seconds);
        }

        if (action === 'close-modal') closeModal();

        if (action === 'draft-add-exercise') {
          const exId = Number(btn.dataset.exerciseId);
          const currentName = document.getElementById('routine-name-input')?.value || '';
          state.manageRoutineDraftIds.push(exId);
          await renderCurrentView();
          const restoredInput = document.getElementById('routine-name-input');
          if (restoredInput) restoredInput.value = currentName;
        }

        if (action === 'draft-move-up') {
          const idx = Number(btn.dataset.index);
          const currentName = document.getElementById('routine-name-input')?.value || '';
          if (idx > 0) {
            const tmp = state.manageRoutineDraftIds[idx - 1];
            state.manageRoutineDraftIds[idx - 1] = state.manageRoutineDraftIds[idx];
            state.manageRoutineDraftIds[idx] = tmp;
            await renderCurrentView();
            const restoredInput = document.getElementById('routine-name-input');
            if (restoredInput) restoredInput.value = currentName;
          }
        }

        if (action === 'draft-move-down') {
          const idx = Number(btn.dataset.index);
          const currentName = document.getElementById('routine-name-input')?.value || '';
          if (idx < state.manageRoutineDraftIds.length - 1) {
            const tmp = state.manageRoutineDraftIds[idx + 1];
            state.manageRoutineDraftIds[idx + 1] = state.manageRoutineDraftIds[idx];
            state.manageRoutineDraftIds[idx] = tmp;
            await renderCurrentView();
            const restoredInput = document.getElementById('routine-name-input');
            if (restoredInput) restoredInput.value = currentName;
          }
        }

        if (action === 'draft-remove') {
          const idx = Number(btn.dataset.index);
          const currentName = document.getElementById('routine-name-input')?.value || '';
          state.manageRoutineDraftIds.splice(idx, 1);
          await renderCurrentView();
          const restoredInput = document.getElementById('routine-name-input');
          if (restoredInput) restoredInput.value = currentName;
        }

        if (action === 'edit-routine') {
          const routine = await db.routines.get(Number(btn.dataset.routineId));
          if (!routine) return;
          state.editingRoutineId = routine.id;
          state.manageRoutineDraftIds = [...(routine.exerciseIds || [])];
          await renderCurrentView();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        if (action === 'cancel-edit-routine') {
          state.editingRoutineId = null;
          state.manageRoutineDraftIds = [];
          await renderCurrentView();
        }

        if (action === 'delete-routine') {
          const routineId = Number(btn.dataset.routineId);
          await db.routines.delete(routineId);
          if (state.editingRoutineId === routineId) {
            state.editingRoutineId = null;
            state.manageRoutineDraftIds = [];
          }
          showToast('Routine gelöscht');
          await renderCurrentView();
        }

        if (action === 'delete-exercise') {
          const exId = Number(btn.dataset.exerciseId);
          await db.exercises.delete(exId);
          const routines = await db.routines.toArray();
          for (const r of routines) {
            if ((r.exerciseIds || []).map(Number).includes(exId)) {
              await db.routines.update(r.id, {
                exerciseIds: r.exerciseIds.filter((id) => Number(id) !== exId)
              });
            }
          }
          showToast('Übung gelöscht');
          await renderCurrentView();
        }

        if (action === 'export-backup') {
          const backup = await exportDatabaseToJson();
          const jsonStr = JSON.stringify(backup, null, 2);
          const blob = new Blob([jsonStr], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const dateStr = new Date().toISOString().slice(0, 10);
          const a = document.createElement('a');
          a.href = url;
          a.download = `iron-gym-backup-${dateStr}.json`;
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(url);
          showToast('JSON-Backup heruntergeladen');
        }

        if (action === 'test-timer-sound') {
          triggerTimerAlarm();
          showToast('Audio-Beep & Vibration ausgelöst');
        }

        if (action === 'test-timer-5s') {
          startRestTimer(5, 'Test-Übung');
        }
      });
    }

    async function initApp() {
      unlockAudioContextOnce();
      bindEvents();
      await ensureSeedData();

      if (getStoredTimer()) {
        syncRestTimerUI();
        ensureTimerLoop();
      }

      updateNavHighlight();
      await renderCurrentView();

      if ('serviceWorker' in navigator) {
        try {
          await navigator.serviceWorker.register('./sw.js', { scope: './' });
        } catch (_) {}
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initApp);
    } else {
      initApp();
    }
  </script>
</body>
</html>
